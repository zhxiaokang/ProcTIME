name: procTME
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python and Mamba
  - python=3.11.*
  - mamba

  # Core R
  - r-base=4.3.*          # or your preferred version
  - r-essentials

  # Jupyter stack
  - jupyterlab
  - r-irkernel            # R kernel for Jupyter
  
  # CRAN / R packages
  - r-biocmanager
  - r-dplyr
  - r-tibble
  - r-survival
  - r-survminer
  - r-factoextra
  - r-ggfortify
  - r-plotly
  - r-gridgraphics
  - r-devtools
  - r-immunedeconv
  - r-ggpubr
  - r-openxlsx
  - r-lsa
  - r-ggstatsplot

  # Bioconductor / others from bioconda
  - bioconductor-biobase
  - bioconductor-consensusclusterplus
  - bioconductor-complexheatmap
  - bioconductor-limma
  - bioconductor-edger
  - bioconductor-clusterprofiler
  - bioconductor-org.hs.eg.db
  - bioconductor-enrichplot
  - bioconductor-gseabase

